# Alternatif terpisah (jika tidak mau menempel ke docker-compose.yml utama).
# Jalankan dari /opt/docker-server-rsi:
#   docker compose -f deploy/docker-compose.wa-blas.yml up -d --build
# Catatan: versi yang terpasang di server adalah blocker dari docker-compose.patch.yml
# (bukan file ini) — file ini hanya cadangan.

services:
  wa-blas:
    build: ./www/pendaftaran-online/wa-blas
    container_name: wa-blas
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - TZ=Asia/Jakarta
    volumes:
      - ./www/pendaftaran-online/wa-blas/.wwebjs_auth:/app/.wwebjs_auth
      - ./www/pendaftaran-online/wa-blas/.wwebjs_cache:/app/.wwebjs_cache
    env_file:
      - ./www/pendaftaran-online/wa-blas/.env
    networks:
      - webnet

networks:
  webnet:
    external: true
    name: webserver_webnet