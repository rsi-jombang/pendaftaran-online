# pendaftaran-online — ikut pola antrian-bpjs (PHP 7.4 FPM)
# Letakkan file ini di: /opt/docker-server-rsi/apache/conf/sites-enabled/pendaftaran-online.conf
# Tidak menyentuh 000-default.conf. Reload: docker compose restart apache

<Directory /var/www/pendaftaran-online/rest-api/public>
    AllowOverride All
    Require all granted
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://php74-fpm:9000"
    </FilesMatch>
</Directory>