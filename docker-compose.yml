services:
  app:
    build: ./rest-api
    container_name: rest-api-app
    env_file:
      - ./rest-api/.env
    volumes:
      - ./rest-api/storage:/var/www/html/storage
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: rest-api-web
    ports:
      - "8080:80"
    volumes:
      - ./rest-api:/var/www/html:ro
      - ./rest-api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  wa-blas:
    build: ./wa-blas
    container_name: wa-blas
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - TZ=Asia/Jakarta
    volumes:
      - ./wa-blas/.wwebjs_auth:/app/.wwebjs_auth
      - ./wa-blas/.wwebjs_cache:/app/.wwebjs_cache
    env_file:
      - ./wa-blas/.env
    restart: unless-stopped
